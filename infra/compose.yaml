name: second-hand-marketplace
services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      POSTGRES_DB: ${DB_NAME:?DB_NAME is required}
      POSTGRES_USER: ${DB_USERNAME:?DB_USERNAME is required}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 12
  backend:
    image: marketplace-backend:latest
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      SERVER_PORT: "25801"
      DB_URL: jdbc:postgresql://postgres:5432/${DB_NAME:?DB_NAME is required}
      DB_USERNAME: ${DB_USERNAME:?DB_USERNAME is required}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      APP_JWT_SECRET: ${APP_JWT_SECRET:?APP_JWT_SECRET is required}
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:-}
    ports:
      - "${PUBLISH_HOST:-0.0.0.0}:25801:25801"
  frontend:
    image: marketplace-frontend:latest
    restart: unless-stopped
    depends_on:
      - backend
    read_only: true
    tmpfs:
      - /tmp
      - /run
      - /var/cache/nginx
      - /etc/nginx/conf.d
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    environment:
      API_ORIGIN: ${API_ORIGIN:-}
    ports:
      - "${PUBLISH_HOST:-0.0.0.0}:25800:80"
volumes:
  postgres-data:
